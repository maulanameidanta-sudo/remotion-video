name: Render MP4

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip

      - name: Extract original project
        run: |
          mkdir -p extracted
          unzip -o pencil-story.zip -d extracted

      - name: Find project and render video
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name package.json -print -quit)")
          echo "Project folder: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install
          npx remotion browser ensure
          npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: story-mp4
          path: extracted/**/out/story.mp4
