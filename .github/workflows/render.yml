name: Render MP4

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm install

      - run: npx remotion browser ensure

      - run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: story-mp4
          path: out/story.mp4
